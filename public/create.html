<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#d2e6ef",
                        "secondary": "#006e1c",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#d2c6a1",
                        "on-primary-fixed-variant": "#544600",
                        "surface": "#f2fbff",
                        "primary-container": "#ffe16d",
                        "surface-dim": "#c9dde6",
                        "tertiary-container": "#ffdcbe",
                        "background": "#f2fbff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffe16d",
                        "on-secondary-container": "#005313",
                        "on-surface": "#0b1e24",
                        "surface-container-low": "#e4f7ff",
                        "outline": "#807757",
                        "on-background": "#0b1e24",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#8b5000",
                        "on-tertiary-container": "#693c00",
                        "primary-fixed-dim": "#e9c400",
                        "secondary-container": "#94f990",
                        "primary": "#705d00",
                        "on-surface-variant": "#4e462a",
                        "surface-container-high": "#d7ebf4",
                        "on-primary-container": "#544600",
                        "on-primary": "#ffffff",
                        "surface-container": "#ddf1fa"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },

    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .style-card {
            cursor: pointer;
            transition: all 0.25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .style-card:hover {
            transform: scale(1.03);
        }

        /* Loading overlay */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(242, 251, 255, 0.96);
            backdrop-filter: blur(16px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }

        #loading-overlay.show {
            display: flex;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-18px) scale(1.1);
            }
        }

        .bounce {
            animation: bounce 1.2s ease-in-out infinite;
        }

        /* Progress bar */
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e9c400, #705d00);
            border-radius: 9999px;
            transition: width 0.6s ease;
        }

        /* Step list */
        .step-item {
            transition: all 0.3s ease;
        }

        .step-item.done {
            color: #006e1c;
        }

        .step-item.active {
            color: #705d00;
            font-weight: 700;
        }

        .step-item.pending {
            color: #4e462a;
            opacity: 0.5;
        }

        .step-item.warn {
            color: #b45309;
            font-weight: 600;
        }

        /* Error state */
        #error-box {
            display: none;
        }

        #error-box.show {
            display: flex;
        }
    </style>
</head>

            <span class="material-symbols-outlined text-lg">arrow_back</span>

    <script>
        // ─── Custom Page Count Toggle ───────────────────────────
        function toggleCustomPages(sel) {
            const customInput = document.getElementById('custom-page-count');
            if (sel.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
            }
        }

        function getPageCount() {
            const sel = document.getElementById('page-count');
            if (sel.value === 'custom') {
                const v = parseInt(document.getElementById('custom-page-count').value) || 10;
                return Math.max(3, Math.min(30, v));
            }
            return parseInt(sel.value);
        }

        // ─── Style Picker ───────────────────────────────────────
        function selectStyle(el, style) {
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.remove('active', 'bg-primary-container', 'ring-4', 'ring-primary-container');
                const check = card.querySelector('.check-icon');
                if (check) check.remove();
                const label = card.querySelector('p');
                if (label) label.className = 'text-center font-medium text-on-surface-variant pb-2';
            });
            el.classList.add('active', 'bg-primary-container', 'ring-4', 'ring-primary-container');
            const label = el.querySelector('p');
            if (label) label.className = 'text-center font-bold text-on-primary-container pb-2';
            const check = document.createElement('span');
            check.className = 'check-icon absolute top-3 right-3 bg-primary text-white rounded-full p-1';
            check.innerHTML = '<span class="material-symbols-outlined text-sm block" style="font-variation-settings: \'FILL\' 1;">check</span>';
            el.appendChild(check);
            document.getElementById('selected-style').value = style;
        }

        // ─── Progress Helpers ───────────────────────────────────
        let totalSteps = 0;
        const emojis = ['✨', '🌟', '🎨', '🖼️', '📖', '🚀', '🌈', '💫'];

        function setProgress(step, total) {
            if (total > 0) totalSteps = total;
            const pct = totalSteps > 0 ? Math.round((step / totalSteps) * 100) : 0;
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('progress-pct').textContent = `${pct}%`;
            document.getElementById('loading-emoji').textContent = emojis[step % emojis.length];
        }

        function addLog(msg, type = 'active') {
            const list = document.getElementById('step-list');
            const item = document.createElement('div');
            item.className = `step-item ${type} flex items-center gap-2 text-sm py-1`;

            const icon = type === 'done' ? '✅' : type === 'warn' ? '⚠️' : type === 'error' ? '❌' : '⏳';
            item.textContent = `${icon} ${msg}`;

            // mark previous active as done
            list.querySelectorAll('.step-item.active').forEach(i => {
                i.classList.remove('active');
                i.classList.add('done');
                i.textContent = '✅ ' + i.textContent.slice(2);
            });

            list.appendChild(item);
            list.scrollTop = list.scrollHeight;

            document.getElementById('loading-msg').textContent = msg;
        }

        function showError(msg) {
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('error-box').classList.add('show');
            document.getElementById('loading-title').textContent = '创作遇到了问题 😢';
            document.getElementById('loading-emoji').textContent = '😢';
            addLog(msg, 'error');
        }

        function resetForm() {
            document.getElementById('loading-overlay').classList.remove('show');
            document.getElementById('error-box').classList.remove('show');
            document.getElementById('step-list').innerHTML = '<p class="text-sm text-on-surface-variant/60 font-bold uppercase tracking-widest mb-3">创作日志</p>';
            document.getElementById('progress-fill').style.width = '3%';
            document.getElementById('progress-pct').textContent = '0%';
            // Remove complete-actions if present
            const ca = document.getElementById('complete-actions');
            if (ca) ca.remove();
            // Reset emoji bounce
            document.getElementById('loading-emoji').classList.add('bounce');
        }

        // ─── Submit & Poll ──────────────────────────────────────
        let pollBookId = null;
        let pollTimer = null;
        let lastLoggedMessage = '';

        // Check URL for bookId (resume tracking an existing generation)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('bookId')) {
            pollBookId = urlParams.get('bookId');
            document.getElementById('loading-overlay').classList.add('show');
            document.getElementById('loading-title').textContent = '正在追踪生成进度...';
            startPolling();
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('book-title').value.trim();
            const theme = document.getElementById('book-theme').value.trim();
            if (!title || !theme) return;

            document.getElementById('loading-overlay').classList.add('show');
            document.getElementById('loading-title').textContent = `正在提交「${title}」...`;
            setProgress(0, 1);
            addLog('📤 提交创作任务...', 'active');

            const payload = {
                title, theme,
                style: document.getElementById('selected-style').value,
                musicStyle: document.getElementById('music-style').value,
                pageCount: getPageCount(),
                outline: document.getElementById('story-outline').value,
            };

            try {
                const resp = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const result = await resp.json();
                if (result.error) throw new Error(result.error);

                pollBookId = result.bookId;
                addLog(`✅ 任务已提交！bookId: ${pollBookId}`, 'done');
                addLog('🔄 后台生成中，即使关闭页面也会继续...', 'active');
                document.getElementById('loading-title').textContent = `正在创作「${title}」...`;

                // Update URL so user can resume
                history.replaceState(null, '', `/create?bookId=${pollBookId}`);
                startPolling();
            } catch (err) {
                showError('提交失败: ' + err.message);
            }
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollStatus, 3000);
            pollStatus(); // immediate first check
        }

        async function pollStatus() {
            if (!pollBookId) return;
            try {
                const resp = await fetch(`/api/books/${pollBookId}`);
                const { book } = await resp.json();
                if (!book) return;

                const total = (book.totalPages || book.pageCount || 10) + 2;
                setProgress(book.progress || 0, total);
                document.getElementById('loading-msg').textContent = book.statusMessage || '处理中...';

                // Only log when message actually changes
                const msg = book.statusMessage || '处理中...';
                if (msg !== lastLoggedMessage) {
                    lastLoggedMessage = msg;
                    if (book.status === 'generating_outline') {
                        addLog('✍️ ' + msg, 'active');
                    } else if (book.status === 'generating_images') {
                        addLog('🖼️ ' + msg, 'active');
                        document.getElementById('loading-title').textContent = `正在创作「${book.title}」...`;
                    }
                }

                if (book.status === 'complete') {
                    clearInterval(pollTimer);
                    setProgress(total, total);
                    sessionStorage.setItem('currentBook', JSON.stringify(book));

                    const failed = book.failedPages || 0;
                    if (failed > 0) {
                        // Some pages failed — show warning with options
                        addLog(`⚠️ 绘本创作完成，但有 ${failed} 页插画生成失败`, 'warn');
                        document.getElementById('loading-title').textContent = '绘本创作完成（部分插画缺失）';
                        document.getElementById('loading-emoji').textContent = '⚠️';
                        document.getElementById('loading-emoji').classList.remove('bounce');
                        document.getElementById('loading-msg').textContent = `${failed} 页插画生成失败，可通过编辑重新生成`;

                        // Show action buttons for failed case
                        const actionsHtml = `
                            <div id="complete-actions" class="w-full max-w-md flex flex-col sm:flex-row gap-3 mt-2">
                                <a href="/reader"
                                    class="flex-1 py-3 bg-primary-container text-on-primary-container rounded-full font-bold text-center hover:scale-105 transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">auto_stories</span>
                                    先去阅读
                                </a>
                                <a href="/edit?bookId=${pollBookId}"
                                    class="flex-1 py-3 bg-secondary text-on-secondary rounded-full font-bold text-center hover:scale-105 transition-all active:scale-95 flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">edit</span>
                                    去编辑修复
                                </a>
                            </div>`;
                        // Insert actions after step-list
                        const stepList = document.getElementById('step-list');
                        stepList.insertAdjacentHTML('afterend', actionsHtml);
                    } else {
                        // All pages succeeded — auto redirect
                        addLog('🎉 绘本创作完成！', 'done');
                        document.getElementById('loading-title').textContent = '绘本创作完成！🎉';
                        setTimeout(() => { window.location.href = '/reader'; }, 1200);
                    }
                } else if (book.status === 'error') {
                    clearInterval(pollTimer);
                    showError(book.statusMessage || '生成失败');
                }
            } catch (err) {
                console.error('Poll error:', err);
            }
        }
    </script>

</body>
